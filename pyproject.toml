[project]
name = "gestao-hospitalar"
version = "1.1.0"
description = "API de Gestão Hospitalar (FastAPI + Beanie/MongoDB)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "beanie>=2.1.0",
    "fastapi-pagination>=0.15.12",
    "pymongo>=4.11",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "faker>=40.12.0",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# um único event loop: o AsyncMongoClient é criado no import e não pode trocar de loop entre testes
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
